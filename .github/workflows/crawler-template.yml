name: Crawler Template

on:
  workflow_call:
    inputs:
      crawler-file:
        required: true
        type: string
      output-json:
        required: true
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python ${{ inputs.crawler-file }}
        continue-on-error: true

      - name: Check results
        run: |
          if [ -f "${{ inputs.output-json }}" ]; then
            echo "JSON 파일 존재 확인"
            wc -l ${{ inputs.output-json }}
            tail -20 ${{ inputs.output-json }}
          else
            echo "JSON 파일이 생성되지 않음"
          fi

      - name: Commit and push results
        run: |
          git config --local user.name 'GitHub Action'
          git config --local user.email 'action@github.com'

          if git diff --quiet ${{ inputs.output-json }}; then
            echo "변경사항 없음"
          else
            echo "변경사항 발견, 커밋 진행"
            git add ${{ inputs.output-json }}
            git commit -m "Update news: $(date +'%Y-%m-%d %H:%M:%S')"

            for i in {1..3}; do
              if git push; then
                echo "푸시 성공"
                break
              else
                echo "푸시 실패, 재시도 $i/3"
                git pull --rebase origin main || true
                sleep 2
              fi
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
